<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刻间计时器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #1f2937;
      padding: 12px;
      min-width: 240px;
      user-select: none;
    }
    .pip-app { display: flex; flex-direction: column; gap: 10px; }
    .pip-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; color: #111827;
    }
    .pip-close {
      background: none; border: none; font-size: 18px; color: #9ca3af;
      cursor: pointer; line-height: 1; padding: 0 2px;
    }
    .pip-close:hover { color: #374151; }
    .pip-field { display: flex; flex-direction: column; gap: 4px; }
    .pip-field label { font-size: 11px; color: #6b7280; font-weight: 500; }
    .pip-field input, .pip-field select {
      border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 8px;
      font-size: 13px; background: #fff; color: #1f2937; outline: none;
    }
    .pip-field input:focus, .pip-field select:focus { border-color: #059669; }
    .pip-row { display: flex; gap: 6px; align-items: center; }
    .pip-row > * { flex: 1; }
    .pip-row .pip-icon-btn { flex: 0 0 32px; }
    .pip-icon-btn {
      border: 1px solid #e5e7eb; background: #fff; border-radius: 6px;
      height: 32px; font-size: 18px; color: #059669; cursor: pointer;
    }
    .pip-icon-btn:hover { background: #f0fdf4; }
    .pip-btn-sm {
      border: none; background: #059669; color: #fff; border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .hidden { display: none !important; }
    .pip-time {
      font-size: 34px; font-weight: 700; text-align: center;
      font-variant-numeric: tabular-nums; color: #111827;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 4px 0;
    }
    .pip-time.running { color: #059669; }
    .pip-status { font-size: 11px; text-align: center; color: #9ca3af; }
    .pip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pip-btn {
      border: none; border-radius: 6px; padding: 8px 0; font-size: 12px;
      font-weight: 500; cursor: pointer; color: #fff;
    }
    .pip-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pip-btn-start { background: #059669; }
    .pip-btn-pause { background: #f59e0b; }
    .pip-btn-stop { background: #ef4444; }
    .pip-btn-save { background: #3b82f6; grid-column: span 2; }
    .pip-meta { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #f3f4f6; padding-top: 8px; }
    .pip-inline { display: flex; gap: 6px; align-items: center; }
    .pip-inline label { white-space: nowrap; }
    .pip-inline input[type="number"] { width: 60px; flex: 0 0 60px; }
    .pip-inline select { flex: 1; }
    .pip-radio { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #374151; cursor: pointer; }
    .pip-radio input { accent-color: #059669; }
  </style>
</head>
<body>
  <div class="pip-app">
    <div class="pip-header">
      <span>刻间计时器 · 悬浮窗</span>
      <button class="pip-close" id="pipClose" title="关闭">×</button>
    </div>

    <div class="pip-field">
      <label>任务类型</label>
      <div class="pip-row">
        <select id="pipTypeSelect"></select>
        <button class="pip-icon-btn" id="pipAddTypeBtn" title="新增类型">+</button>
      </div>
      <div class="pip-row hidden" id="pipNewTypeRow">
        <input id="pipNewType" placeholder="输入新类型" />
        <button class="pip-btn-sm" id="pipConfirmType">添加</button>
      </div>
    </div>

    <div class="pip-field">
      <label>任务内容</label>
      <input id="pipContent" placeholder="如：订单导出" />
    </div>

    <div class="pip-time" id="pipTime">00:00:00</div>
    <div class="pip-status" id="pipStatus">就绪</div>

    <div class="pip-actions">
      <button class="pip-btn pip-btn-start" id="pipStart">开始</button>
      <button class="pip-btn pip-btn-pause" id="pipPause" disabled>暂停</button>
      <button class="pip-btn pip-btn-stop" id="pipStop" disabled>结束</button>
      <button class="pip-btn pip-btn-save" id="pipSave" disabled>保存记录</button>
    </div>

    <div class="pip-meta">
      <div class="pip-field pip-inline">
        <label>处理数量</label>
        <input id="pipQuantity" type="number" min="0" placeholder="0" />
        <select id="pipUnit">
          <option value="条">条</option>
          <option value="项">项</option>
          <option value="单">单</option>
          <option value="封">封</option>
          <option value="个">个</option>
          <option value="次">次</option>
        </select>
      </div>
      <div class="pip-field pip-inline">
        <label>任务属性</label>
        <label class="pip-radio"><input type="radio" name="pipNature" value="常规" checked> 常规</label>
        <label class="pip-radio"><input type="radio" name="pipNature" value="突发"> 突发</label>
      </div>
      <div class="pip-field">
        <label>备注（系统问题、外部等待等）</label>
        <input id="pipNote" placeholder="选填" />
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kejian-timer-data';
    const TIMER_STATE_KEY = 'kejian-timer-timer-state';
    const FLOAT_TASK_KEY = 'kejian-timer-float-task';
    const defaultData = { entries: [], types: ['订单导出','邮件回复','制单发货','评论回复','文档整理'], settings: { edgeDock: false } };

    function getLS(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } }
    function setLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    function loadData() { return getLS(STORAGE_KEY) || JSON.parse(JSON.stringify(defaultData)); }
    function saveData(data) { setLS(STORAGE_KEY, data); broadcast('data-updated'); }
    function getTimerState() { return getLS(TIMER_STATE_KEY); }
    function setTimerState(state) { setLS(TIMER_STATE_KEY, state); broadcast('timer-state-updated'); }
    function getFloatTask() { return getLS(FLOAT_TASK_KEY) || { taskType: '', content: '' }; }
    function setFloatTask(task) { setLS(FLOAT_TASK_KEY, task); }
    function broadcast(type) {
      try { const bc = new BroadcastChannel('kejian-timer'); bc.postMessage({ type }); bc.close(); } catch {}
    }
    function formatClock(sec) {
      const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      return [h,m,s].map(x => String(x).padStart(2,'0')).join(':');
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

    let appData = loadData();
    let floatTask = getFloatTask();

    const els = {
      typeSelect: document.getElementById('pipTypeSelect'),
      addTypeBtn: document.getElementById('pipAddTypeBtn'),
      newTypeRow: document.getElementById('pipNewTypeRow'),
      newType: document.getElementById('pipNewType'),
      confirmType: document.getElementById('pipConfirmType'),
      content: document.getElementById('pipContent'),
      time: document.getElementById('pipTime'),
      status: document.getElementById('pipStatus'),
      startBtn: document.getElementById('pipStart'),
      pauseBtn: document.getElementById('pipPause'),
      stopBtn: document.getElementById('pipStop'),
      saveBtn: document.getElementById('pipSave'),
      quantity: document.getElementById('pipQuantity'),
      unit: document.getElementById('pipUnit'),
      note: document.getElementById('pipNote'),
      closeBtn: document.getElementById('pipClose')
    };

    function renderTypes() {
      const current = els.typeSelect.value;
      els.typeSelect.innerHTML = '';
      appData.types.forEach(t => {
        const opt = document.createElement('option'); opt.value = t; opt.textContent = t; els.typeSelect.appendChild(opt);
      });
      const addOpt = document.createElement('option'); addOpt.value = '__add_new__'; addOpt.textContent = '➕ 新增类型...'; els.typeSelect.appendChild(addOpt);
      const preferred = floatTask.taskType && appData.types.includes(floatTask.taskType) ? floatTask.taskType : appData.types[0];
      els.typeSelect.value = appData.types.includes(current) ? current : preferred;
    }

    function getNature() {
      return document.querySelector('input[name="pipNature"]:checked')?.value || '常规';
    }

    function updateDisplay() {
      const state = getTimerState();
      const session = state && state.running ? Math.floor((Date.now() - state.startAt) / 1000) : 0;
      const sec = (state ? state.elapsed || 0 : 0) + session;
      els.time.textContent = formatClock(sec);
      els.time.classList.toggle('running', !!(state && state.running));

      let statusText = '就绪';
      if (state && state.running) statusText = '计时中';
      else if (state && state.startTime && state.endTime) statusText = '待保存';
      else if (state && (state.elapsed || 0) > 0) statusText = '已暂停';
      els.status.textContent = statusText;

      const running = !!(state && state.running);
      const elapsed = state ? state.elapsed || 0 : 0;
      const hasResult = !!(state && state.startTime && state.endTime);
      const hasTime = running || elapsed > 0;

      els.startBtn.disabled = running;
      els.startBtn.textContent = elapsed > 0 ? '继续' : '开始';
      els.pauseBtn.disabled = !running;
      els.stopBtn.disabled = !hasTime;
      els.saveBtn.disabled = !hasResult;

      if (state && state.taskType && appData.types.includes(state.taskType) && !els.typeSelect.matches(':focus')) {
        els.typeSelect.value = state.taskType;
      }
      if (state && state.content && !els.content.matches(':focus')) {
        els.content.value = state.content;
      }
    }

    function syncTaskToState() {
      const state = getTimerState();
      if (!state) return;
      const taskType = els.typeSelect.value;
      const content = els.content.value.trim();
      if (taskType === state.taskType && content === state.content) return;
      setTimerState({ ...state, taskType, content: content || taskType });
      setFloatTask({ taskType, content });
    }

    function startTimer() {
      const state = getTimerState() || {};
      if (state.running) return;
      const now = Date.now();
      const taskType = els.typeSelect.value;
      const content = els.content.value.trim();
      setTimerState({
        running: true,
        startAt: now,
        originalStartAt: state.originalStartAt || now,
        elapsed: state.elapsed || 0,
        taskType,
        content: content || taskType
      });
      setFloatTask({ taskType, content });
      updateDisplay();
    }

    function pauseTimer() {
      const state = getTimerState();
      if (!state || !state.running) return;
      const session = Math.floor((Date.now() - state.startAt) / 1000);
      setTimerState({ ...state, running: false, startAt: null, elapsed: (state.elapsed || 0) + session });
      updateDisplay();
    }

    function stopTimer() {
      const state = getTimerState();
      if (!state) return;
      const running = state.running;
      const session = running ? Math.floor((Date.now() - state.startAt) / 1000) : 0;
      const elapsed = (state.elapsed || 0) + session;
      if (elapsed === 0 && !running) return;
      const endAt = new Date();
      const startAt = new Date(state.originalStartAt || (endAt.getTime() - elapsed * 1000));
      const pad = n => String(n).padStart(2,'0');
      const fmt = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const taskType = els.typeSelect.value;
      const content = els.content.value.trim() || taskType;
      setTimerState({
        ...state,
        running: false,
        startAt: null,
        elapsed,
        taskType,
        content,
        startTime: fmt(startAt),
        endTime: fmt(endAt)
      });
      setFloatTask({ taskType, content });
      updateDisplay();
    }

    function saveEntry() {
      const state = getTimerState();
      if (!state || !state.startTime || !state.endTime) return;
      const data = loadData();
      const quantity = Number(els.quantity.value) || 1;
      const entry = {
        id: uid(),
        date: new Date().toISOString().slice(0,10),
        taskType: state.taskType,
        nature: getNature(),
        content: state.content,
        startTime: state.startTime,
        endTime: state.endTime,
        quantity,
        unit: els.unit.value,
        note: els.note.value.trim(),
        createdAt: new Date().toISOString()
      };
      data.entries.push(entry);
      saveData(data);
      setTimerState(null);
      setFloatTask({ taskType: state.taskType, content: '' });
      els.content.value = '';
      els.quantity.value = '';
      els.note.value = '';
      updateDisplay();
    }

    function addNewType() {
      const v = els.newType.value.trim();
      els.newTypeRow.classList.add('hidden');
      if (!v) return;
      if (!appData.types.includes(v)) {
        appData.types.push(v);
        saveData(appData);
      }
      renderTypes();
      els.typeSelect.value = v;
      updateDisplay();
    }

    renderTypes();
    if (floatTask.content) els.content.value = floatTask.content;

    els.startBtn.addEventListener('click', startTimer);
    els.pauseBtn.addEventListener('click', pauseTimer);
    els.stopBtn.addEventListener('click', stopTimer);
    els.saveBtn.addEventListener('click', saveEntry);
    els.addTypeBtn.addEventListener('click', () => { els.newTypeRow.classList.remove('hidden'); els.newType.focus(); });
    els.confirmType.addEventListener('click', addNewType);
    els.newType.addEventListener('keydown', (e) => { if (e.key === 'Enter') addNewType(); });
    els.typeSelect.addEventListener('change', () => {
      if (els.typeSelect.value === '__add_new__') {
        els.newTypeRow.classList.remove('hidden');
        els.newType.focus();
        renderTypes();
      } else {
        syncTaskToState();
      }
    });
    els.content.addEventListener('input', syncTaskToState);
    els.closeBtn.addEventListener('click', () => window.close());

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) appData = loadData();
      if (e.key === FLOAT_TASK_KEY) floatTask = getFloatTask();
      updateDisplay();
    });
    try {
      const bc = new BroadcastChannel('kejian-timer');
      bc.onmessage = () => updateDisplay();
    } catch {}

    setInterval(updateDisplay, 1000);
    updateDisplay();
  </script>
</body>
</html>
